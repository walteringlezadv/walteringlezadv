name: Sync articles to blog

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/articles/**.tsx'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Extract articles
        run: node scripts/extract-articles.mjs

      - name: Send to blog API
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        run: |
          curl -X POST https://walterblog-ezbkvzzn.manus.space/api/sync/articles \
            -H "Authorization: Bearer $SYNC_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/articles-payload.json
