name: Sync articles to blog

on:
  push:
    branches:
      - 'artigo/**'
      - draft
    paths:
      - 'src/content/articles/**.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Detect new article
        id: detect
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            NEW=$(git diff --name-status HEAD~1 HEAD -- 'src/content/articles/*.md' | grep '^A' | wc -l | tr -d ' ')
          else
            NEW=$(git show --stat HEAD -- 'src/content/articles/*.md' | grep '\.md' | wc -l | tr -d ' ')
          fi
          echo "new_articles=$NEW" >> $GITHUB_OUTPUT

      - name: Create or reuse Pull Request
        if: steps.detect.outputs.new_articles != '0'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Branch que disparou o workflow (artigo/... ou draft)
          BRANCH="$GITHUB_REF_NAME"

          # Detecta nome do artigo novo
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            ARTICLE=$(git diff --name-status HEAD~1 HEAD -- 'src/content/articles/*.md' | grep '^A' | head -1 | awk '{print $2}' | xargs basename | sed 's/\.md$//')
          else
            ARTICLE=$(git show --stat HEAD -- 'src/content/articles/*.md' | grep '\.md' | head -1 | awk '{print $1}' | xargs basename | sed 's/\.md$//')
          fi

          # Verifica se ja existe PR aberto desta branch para main
          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            PR_URL=$(gh pr view "$EXISTING" --json url --jq '.url')
            echo "PR existente atualizado pelo novo commit: $PR_URL"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Artigo aguarda aprovacao: $ARTICLE" \
              --body "Artigo redigido automaticamente pela tarefa agendada. Revisar conteudo e aprovar com **Merge pull request** para publicar no blog.")
            echo "PR criado: $PR_URL"
          fi

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Install email dependencies
        if: steps.detect.outputs.new_articles != '0'
        run: npm install nodemailer gray-matter marked

      - name: Send article email
        if: steps.detect.outputs.new_articles != '0'
        env:
          GMAIL_USER: walter.inglezadv@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: node scripts/send-article-email.mjs
