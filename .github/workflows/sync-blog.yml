name: Sync Blog

on:
  push:
    branches:
      - draft
    paths:
      - 'src/content/articles/**.md'

jobs:
  create-pr-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft
          fetch-depth: 2

      - name: Identify article from latest commit
        id: article
        run: |
          CHANGED=$(git show --name-only --format='' HEAD \
            | grep '^src/content/articles/.*\.md$' \
            | head -1)

          if [ -z "$CHANGED" ]; then
            echo "No article .md found in latest commit — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "file=$CHANGED" >> $GITHUB_OUTPUT

          SLUG=$(basename "$CHANGED" .md)
          TITLE=$(grep '^title:' "$CHANGED" | head -1 \
            | sed 's/^title:[[:space:]]*//' | tr -d '"')
          EXCERPT=$(grep '^excerpt:' "$CHANGED" | head -1 \
            | sed 's/^excerpt:[[:space:]]*//' | tr -d '"')
          CATEGORY=$(grep '^category:' "$CHANGED" | head -1 \
            | sed 's/^category:[[:space:]]*//' | tr -d '"')

          echo "slug=$SLUG"       >> $GITHUB_OUTPUT
          echo "title=$TITLE"     >> $GITHUB_OUTPUT
          echo "excerpt=$EXCERPT" >> $GITHUB_OUTPUT
          echo "category=$CATEGORY" >> $GITHUB_OUTPUT

          echo "Artigo identificado: $TITLE ($SLUG)"

      - name: Create or update Pull Request
        id: pr
        if: steps.article.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR from draft to main already exists
          EXISTING=$(gh pr list --base main --head draft --json number --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists — updating title and body."
            gh pr edit "$EXISTING" \
              --title "artigo: ${{ steps.article.outputs.slug }}" \
              --body "**Categoria:** ${{ steps.article.outputs.category }}
          **Slug:** ${{ steps.article.outputs.slug }}

          ${{ steps.article.outputs.excerpt }}"
            PR_URL=$(gh pr view "$EXISTING" --json url --jq '.url')
          else
            echo "Creating new PR from draft to main."
            PR_URL=$(gh pr create \
              --base main \
              --head draft \
              --title "artigo: ${{ steps.article.outputs.slug }}" \
              --body "**Categoria:** ${{ steps.article.outputs.category }}
          **Slug:** ${{ steps.article.outputs.slug }}

          ${{ steps.article.outputs.excerpt }}")
          fi

          echo "pr-url=$PR_URL" >> $GITHUB_OUTPUT
          echo "PR URL: $PR_URL"

      - name: Send email notification
        if: >
          steps.article.outputs.skip != 'true' &&
          steps.pr.outputs.pr-url != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          from: "Blog Walter Inglez <${{ secrets.GMAIL_USER }}>"
          subject: >-
            Artigo aguardando aprovacao —
            ${{ steps.article.outputs.title }}
          html_body: |
            <p><strong>Artigo aguardando aprovação</strong></p>
            <p>
              <a href="${{ steps.pr.outputs.pr-url }}"
                 style="background:#1a2e22;color:#f5f0e8;padding:10px 20px;
                        border-radius:4px;text-decoration:none;font-weight:bold;">
                Revisar e aprovar artigo
              </a>
            </p>
            <p>Abra o link, leia o artigo, e clique em
               <strong>Merge pull request</strong> no GitHub para publicar.<br>
               Funciona pelo Mac e pelo iPhone.</p>
            <hr>
            <p>
              <strong>Walter Inglez Advocacia
              · ${{ steps.article.outputs.category }}</strong>
            </p>
            <h2>${{ steps.article.outputs.title }}</h2>
            <p>
              Aguardando aprovação
              · será publicado em
              /blog/${{ steps.article.outputs.slug }}
            </p>
            <p>${{ steps.article.outputs.excerpt }}</p>
