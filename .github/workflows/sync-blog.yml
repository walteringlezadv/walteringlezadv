name: Sync articles to blog

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/articles/**.tsx'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract articles
        run: node scripts/extract-articles.mjs

      - name: Send to blog API
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        run: |
          curl -X POST https://walterblog-ezbkvzzn.manus.space/api/sync/articles \
            -H "Authorization: Bearer $SYNC_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/articles-payload.json

      - name: Detect new article
        id: detect
        run: |
          NEW=$(git diff --name-status HEAD~1 HEAD -- 'src/content/articles/*.tsx' | grep '^A' | wc -l | tr -d ' ')
          echo "new_articles=$NEW" >> $GITHUB_OUTPUT

      - name: Install nodemailer
        if: steps.detect.outputs.new_articles != '0'
        run: npm install nodemailer

      - name: Send article email
        if: steps.detect.outputs.new_articles != '0'
        env:
          GMAIL_USER: walter.inglezadv@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/send-article-email.mjs
