name: Notificar novo artigo por e-mail

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/articles/*.tsx'

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identificar artigo novo ou modificado
        id: artigo
        run: |
          ARQUIVO=$(git diff --name-only HEAD~1 HEAD -- 'src/content/articles/*.tsx' | grep -v 'index.tsx' | head -1)
          if [ -z "$ARQUIVO" ]; then
            echo "Nenhum artigo novo encontrado."
            echo "encontrado=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "encontrado=true" >> $GITHUB_OUTPUT
          echo "arquivo=$ARQUIVO" >> $GITHUB_OUTPUT
          SLUG=$(basename "$ARQUIVO" .tsx)
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          TITULO=$(grep -m1 'title:' "$ARQUIVO" | sed 's/.*title: *"\(.*\)".*/\1/')
          CATEGORIA=$(grep -m1 'category:' "$ARQUIVO" | sed 's/.*category: *"\(.*\)".*/\1/')
          DATA=$(grep -m1 'date:' "$ARQUIVO" | sed 's/.*date: *"\(.*\)".*/\1/')
          echo "titulo=$TITULO" >> $GITHUB_OUTPUT
          echo "categoria=$CATEGORIA" >> $GITHUB_OUTPUT
          echo "data=$DATA" >> $GITHUB_OUTPUT

      - name: Enviar e-mail de notificação
        if: steps.artigo.outputs.encontrado == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Blog WI — Novo artigo: ${{ steps.artigo.outputs.titulo }}"
          to: walter.inglezadv@gmail.com
          from: "Blog Walter Inglez <${{ secrets.GMAIL_USER }}>"
          body: |
            Novo artigo publicado no Blog WI.

            Título: ${{ steps.artigo.outputs.titulo }}
            Categoria: ${{ steps.artigo.outputs.categoria }}
            Data: ${{ steps.artigo.outputs.data }}
            Link: https://blog.walteringlezadv.com.br/blog/${{ steps.artigo.outputs.slug }}

            O artigo foi commitado pelo Manus e publicado automaticamente pelo Cloudflare Pages.

            Acesse o link acima para revisar o conteúdo publicado.
            Se desejar ajustar algum trecho, edite o arquivo diretamente no GitHub:
            https://github.com/walteringlezadv/walteringlezadv/blob/main/${{ steps.artigo.outputs.arquivo }}

            ---
            Blog Walter Inglez Advocacia e Consultoria
            blog.walteringlezadv.com.br
